name: Sweep
options:
  bundleIdPrefix: com.erikkirillov
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true

configs:
  Debug: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: "6.0"
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_STYLE: Manual
    OTHER_SWIFT_FLAGS: "-strict-concurrency=complete"
    SWIFT_EMIT_LOC_STRINGS: NO
  configs:
    Debug:
      CODE_SIGNING_REQUIRED: NO
      CODE_SIGNING_ALLOWED: NO
    # Release: "Erik Local Signing" when present (keeps the app identity across rebuilds); scripts/install.sh falls back to ad-hoc (-) otherwise.
    Release:
      CODE_SIGNING_REQUIRED: YES
      CODE_SIGNING_ALLOWED: YES
      CODE_SIGN_IDENTITY: "Erik Local Signing"
      DEAD_CODE_STRIPPING: YES
      SWIFT_OPTIMIZATION_LEVEL: "-O"
      SWIFT_COMPILATION_MODE: wholemodule
      DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
      STRIP_INSTALLED_PRODUCT: YES
      CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
      CODE_SIGN_ENTITLEMENTS: Resources/Sweep.entitlements

schemes:
  Sweep:
    build:
      targets:
        Sweep: all
    run:
      config: Debug
    archive:
      config: Release

targets:
  Sweep:
    type: application
    platform: macOS
    sources:
      - path: Sources
        type: group
      - path: Resources/Assets.xcassets
      - path: Resources/Sounds
        type: folder
    info:
      path: Resources/Info.plist
      properties:
        CFBundleName: Sweep
        CFBundleDisplayName: Sweep
        CFBundleIdentifier: com.erikkirillov.Sweep
        CFBundleVersion: "1"
        CFBundleShortVersionString: "1.0.0"
        CFBundlePackageType: APPL
        LSUIElement: YES
        NSHighResolutionCapable: YES
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.erikkirillov.Sweep
        PRODUCT_NAME: Sweep
        INFOPLIST_FILE: Resources/Info.plist
        MACOSX_DEPLOYMENT_TARGET: "15.0"
        ENABLE_SANDBOX: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Release:
          SWIFT_OPTIMIZATION_LEVEL: "-O"
